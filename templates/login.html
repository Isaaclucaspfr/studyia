{% extends "base.html" %}

{% block title %}Entrar — StudyIA{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3.5rem auto;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--chakra-radii-2xl); box-shadow: var(--chakra-shadows-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="display: inline-block; padding: 0.25rem 0.85rem; background: var(--chakra-colors-teal-50); color: var(--chakra-colors-teal-700); border: 1px solid var(--chakra-colors-teal-200); border-radius: var(--chakra-radii-full); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; margin-bottom: 0.85rem; text-transform: uppercase;">
                PROJETO A3 — IA PARA O COTIDIANO
            </div>
            <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--chakra-colors-gray-900); letter-spacing: -0.02em;">Acessar o StudyIA</h2>
            <p style="color: var(--chakra-colors-gray-500); font-size: 0.9rem; margin-top: 0.35rem;">
                Transforme qualquer tema em aprendizagem estruturada
            </p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="login_input">Usuário ou E-mail:</label>
                <input type="text" name="login_input" id="login_input" class="form-control" placeholder="ex: isaac ou seu@email.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.25rem; padding: 0.8rem; font-size: 0.95rem;">
                Entrar na Conta
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--chakra-colors-gray-600); border-top: 1px solid var(--chakra-colors-gray-200); padding-top: 1.25rem;">
            Não tem uma conta ainda? <a href="{{ url_for('register') }}" style="color: var(--chakra-colors-teal-600); font-weight: 700; text-decoration: none;">Cadastre-se gratuitamente</a>
        </div>
    </div>
</div>
{% endblock %}
