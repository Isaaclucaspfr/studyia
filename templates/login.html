{% extends "base.html" %}

{% block title %}Entrar — StudyIA{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Acessar o StudyIA</h1>
            <p class="auth-subtitle">Transforme qualquer tema em aprendizagem estruturada</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="login_input">Usuário ou E-mail</label>
                <input type="text" name="login_input" id="login_input" class="form-control" placeholder="ex: isaac ou seu@email.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Entrar na Conta
            </button>
        </form>

        <p class="auth-footer">
            Não tem uma conta ainda? <a href="{{ url_for('register') }}">Cadastre-se gratuitamente</a>
        </p>
    </div>
</div>
{% endblock %}
