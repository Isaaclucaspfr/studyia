{% extends "base.html" %}

{% block title %}Cadastro — StudyIA{% endblock %}

{% block content %}
<div class="auth-page">
    <section aria-labelledby="authTitle">
        <div class="auth-logo" aria-hidden="true">
            <svg class="brand-mark" viewBox="0 0 24 24" focusable="false"><path d="M11.5 5.2A3 3 0 0 0 6.2 6.5a3 3 0 0 0-2.3 4 3.2 3.2 0 0 0 .4 5.2 3 3 0 0 0 3.5 3.3 3 3 0 0 0 3.7.8"/><path d="M12.5 5.2a3 3 0 0 1 5.3 1.3 3 3 0 0 1 2.3 4 3.2 3.2 0 0 1-.4 5.2 3 3 0 0 1-3.5 3.3 3 3 0 0 1-3.7.8"/><path d="M12 5.5v14M12 9H9.5L8 7.8M12 13.5H9l-1.5 1.7M12 9h2.5L16 7.8M12 13.5h3l1.5 1.7"/><circle class="brand-mark-node" cx="8" cy="7.8" r="1.1"/><circle class="brand-mark-node" cx="7.5" cy="15.2" r="1.1"/><circle class="brand-mark-node" cx="16" cy="7.8" r="1.1"/><circle class="brand-mark-node" cx="16.5" cy="15.2" r="1.1"/></svg>
        </div>

        <div class="card auth-card">
            <div class="auth-header">
                <h1 class="auth-title" id="authTitle">Criar conta no Study<span class="brand-name-accent">IA</span></h1>
                <p class="auth-subtitle">Guarde seus estudos, planos e seminários em um só lugar</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg>
                        <input type="text" name="name" id="name" class="form-control" placeholder="ex: Isaac Lucas" autocomplete="name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Nome de usuário</label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" aria-hidden="true" focusable="false"><use href="#i-at"></use></svg>
                        <input type="text" name="username" id="username" class="form-control" placeholder="ex: isaac_estudos" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" aria-hidden="true" focusable="false"><use href="#i-mail"></use></svg>
                        <input type="email" name="email" id="email" class="form-control" placeholder="ex: isaac@exemplo.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
                        <!-- Mostrar/ocultar senha (auth.js). Sem JS continua hidden e o campo funciona normal -->
                        <button type="button" class="password-toggle" aria-controls="password" aria-label="Mostrar senha" aria-pressed="false" hidden>
                            <svg class="icon password-toggle-show" aria-hidden="true" focusable="false"><use href="#i-eye"></use></svg>
                            <svg class="icon password-toggle-hide" aria-hidden="true" focusable="false"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmar senha</label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repita a senha" minlength="6" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" aria-controls="confirm_password" aria-label="Mostrar senha" aria-pressed="false" hidden>
                            <svg class="icon password-toggle-show" aria-hidden="true" focusable="false"><use href="#i-eye"></use></svg>
                            <svg class="icon password-toggle-hide" aria-hidden="true" focusable="false"><use href="#i-eye-off"></use></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" data-loading-text="Criando conta…">
                    Criar conta
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
                </button>
            </form>

            <p class="auth-footer">
                Já tem uma conta cadastrada? <a href="{{ url_for('login') }}">Faça login</a>
            </p>
        </div>
    </section>
</div>
{% endblock %}

{% block scripts_extra %}
<!-- Olho da senha e fundo de rede neural animada: só no login e no cadastro -->
<script src="{{ url_for('static', filename='js/auth.js') }}?v=auth_v1"></script>
<script src="{{ url_for('static', filename='js/neural-bg.js') }}?v=auth_v2"></script>
{% endblock %}
